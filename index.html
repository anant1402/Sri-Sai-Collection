<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Sai Collection - Cloud Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableStickerArea, #printableStickerArea * { visibility: visible; }
      #printableStickerArea { position: absolute; left: 0; top: 0; width: 100%; display: flex; justify-content: center; }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans pb-10">

  <!-- Top Navbar -->
  <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Sri Sai Collection</h1>
      <p class="text-xs text-indigo-200" id="syncStatus">Offline / Local Mode</p>
    </div>
    <button onclick="openConfigModal()" class="bg-indigo-800 text-xs px-3 py-2 rounded border border-indigo-500">
      ⚙️ Firebase Setup
    </button>
  </header>

  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Role & PIN Switcher -->
    <div class="bg-white p-3 rounded-lg shadow flex justify-between items-center">
      <div>
        <span class="text-sm font-semibold">Current Mode: </span>
        <span id="roleLabel" class="text-sm text-green-600 font-bold">Staff Mode</span>
      </div>
      <button onclick="switchRole()" class="text-xs bg-gray-200 text-gray-800 px-3 py-1.5 rounded">
        Switch to Owner
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-300 bg-white rounded-t-lg">
      <button onclick="showTab('billing')" class="flex-1 py-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600" id="tab-billing">
        ⚡ POS Billing
      </button>
      <button onclick="showTab('stock')" class="flex-1 py-3 text-center text-gray-500" id="tab-stock">
        📦 Stock Entry
      </button>
      <button onclick="showTab('reports')" class="flex-1 py-3 text-center text-gray-500 owner-only hidden" id="tab-reports">
        📊 Reports
      </button>
    </div>

    <!-- TAB 1: POS Billing -->
    <div id="sec-billing" class="tab-content bg-white p-4 rounded-b-lg shadow space-y-3">
      <h2 class="font-bold text-gray-700">Quick Scan & Bill</h2>
      
      <div class="flex gap-2">
        <input type="text" id="manualBarcode" placeholder="Enter Barcode / Item ID" class="border p-2 rounded text-sm w-full">
        <button onclick="addItemToBill()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-bold">Add</button>
      </div>

      <!-- Customer Details for WhatsApp -->
      <div class="border-t pt-2 mt-2">
        <label class="text-xs font-bold text-gray-500">Customer Mobile (For WhatsApp Bill):</label>
        <input type="tel" id="custMobile" placeholder="e.g. 9876543210" class="border p-2 rounded text-sm w-full mt-1">
      </div>
      
      <div class="border-t pt-2">
        <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Current Cart</h3>
        <ul id="cartList" class="divide-y text-sm max-h-40 overflow-y-auto mb-3"></ul>
        <div class="flex justify-between items-center font-bold text-lg border-t pt-2">
          <span>Total:</span>
          <span id="cartTotal">₹0</span>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-3">
          <button onclick="completeSale(false)" class="bg-green-600 text-white py-2.5 rounded-lg font-bold text-xs shadow">
            🖨️ Print Bill
          </button>
          <button onclick="completeSale(true)" class="bg-emerald-700 text-white py-2.5 rounded-lg font-bold text-xs shadow">
            💬 Complete & WhatsApp
          </button>
        </div>
      </div>
    </div>

    <!-- TAB 2: Stock Entry -->
    <div id="sec-stock" class="tab-content bg-white p-4 rounded-b-lg shadow space-y-3 hidden">
      <h2 class="font-bold text-gray-700">Add Stock Item</h2>
      <input type="text" id="itemName" placeholder="Item Name (e.g. Kurti / Shirt)" class="w-full border p-2 rounded text-sm">
      <div class="flex gap-2">
        <input type="number" id="itemPrice" placeholder="Selling Price (₹)" class="w-full border p-2 rounded text-sm">
        <input type="number" id="itemCost" placeholder="Cost Price (₹)" class="w-full border p-2 rounded text-sm owner-only hidden">
      </div>
      <div class="flex gap-2">
        <input type="number" id="itemQty" placeholder="Quantity" class="w-full border p-2 rounded text-sm">
        <input type="text" id="itemBarcode" placeholder="Barcode (Optional)" class="w-full border p-2 rounded text-sm">
      </div>
      <button onclick="saveStockItem()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold text-sm">
        Save Item & Sync
      </button>

      <!-- Live Stock List -->
      <div class="border-t pt-3 mt-4">
        <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Synced Live Inventory</h3>
        <div id="stockList" class="space-y-2 max-h-60 overflow-y-auto text-sm"></div>
      </div>
    </div>

    <!-- TAB 3: Reports -->
    <div id="sec-reports" class="tab-content bg-white p-4 rounded-b-lg shadow space-y-3 hidden">
      <h2 class="font-bold text-gray-700">Sales Overview</h2>
      <div class="bg-indigo-50 p-3 rounded text-center">
        <p class="text-xs text-indigo-500 font-bold">Total Sales</p>
        <p id="statSales" class="text-lg font-bold text-indigo-700">₹0</p>
      </div>
    </div>

  </div>

  <!-- Barcode Sticker Modal -->
  <div id="stickerModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white p-5 rounded-lg w-full max-w-xs space-y-3 text-center">
      <h3 class="font-bold text-md text-gray-800">Print Barcode Sticker</h3>
      <div id="printableStickerArea" class="border p-3 rounded bg-white inline-block">
        <p class="font-bold text-sm" id="stkName">Item Name</p>
        <svg id="stkBarcode" class="mx-auto my-1"></svg>
        <p class="font-bold text-sm text-indigo-700" id="stkPrice">MRP: ₹0</p>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="window.print()" class="w-full bg-indigo-600 text-white py-2 rounded text-xs font-bold">🖨️ Print Now</button>
        <button onclick="closeStickerModal()" class="w-full bg-gray-300 text-gray-700 py-2 rounded text-xs">Close</button>
      </div>
    </div>
  </div>

  <!-- Firebase Config Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden">
    <div class="bg-white p-5 rounded-lg w-full max-w-sm space-y-3">
      <h3 class="font-bold text-lg">Paste Firebase Config</h3>
      <textarea id="firebaseConfigInput" rows="6" class="w-full border p-2 text-xs font-mono rounded" placeholder='{ "apiKey": "..." }'></textarea>
      <div class="flex gap-2">
        <button onclick="saveFirebaseConfig()" class="w-full bg-indigo-600 text-white py-2 rounded text-sm font-bold">Connect Cloud</button>
        <button onclick="closeConfigModal()" class="w-full bg-gray-300 py-2 rounded text-sm">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let db;
    let isOwner = false;
    let ownerPIN = "1234";
    let inventory = [];
    let cart = [];

    window.onload = function() {
      const savedConfig = localStorage.getItem('sri_sai_firebase_config');
      if (savedConfig) {
        initFirebase(JSON.parse(savedConfig));
      }
    };

    function initFirebase(config) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(config);
        db = firebase.database();
        document.getElementById('syncStatus').innerText = '🟢 Cloud Live Sync Active';
        document.getElementById('syncStatus').className = 'text-xs text-green-300 font-bold';
        
        db.ref('inventory').on('value', (snapshot) => {
          const data = snapshot.val();
          inventory = data ? Object.values(data) : [];
          renderInventory();
        });
      } catch (err) {
        alert('Firebase Error: ' + err.message);
      }
    }

    function saveFirebaseConfig() {
      const input = document.getElementById('firebaseConfigInput').value;
      try {
        const parsed = JSON.parse(input);
        localStorage.setItem('sri_sai_firebase_config', JSON.stringify(parsed));
        initFirebase(parsed);
        closeConfigModal();
      } catch (e) {
        alert('Invalid JSON Config!');
      }
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('sec-' + tab).classList.remove('hidden');

      ['billing', 'stock', 'reports'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if (btn) {
          btn.classList.remove('font-bold', 'text-indigo-600', 'border-b-2', 'border-indigo-600');
          btn.classList.add('text-gray-500');
        }
      });

      const activeBtn = document.getElementById('tab-' + tab);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-500');
        activeBtn.classList.add('font-bold', 'text-indigo-600', 'border-b-2', 'border-indigo-600');
      }
    }

    function switchRole() {
      if (!isOwner) {
        let pin = prompt("Enter 4-Digit Owner PIN:");
        if (pin === ownerPIN) {
          isOwner = true;
          document.getElementById('roleLabel').innerText = "Owner Mode";
          document.getElementById('roleLabel').className = "text-sm text-indigo-600 font-bold";
          document.querySelectorAll('.owner-only').forEach(el => el.classList.remove('hidden'));
        } else alert("Incorrect PIN!");
      } else {
        isOwner = false;
        document.getElementById('roleLabel').innerText = "Staff Mode";
        document.getElementById('roleLabel').className = "text-sm text-green-600 font-bold";
        document.querySelectorAll('.owner-only').forEach(el => el.classList.add('hidden'));
        showTab('billing');
      }
    }

    function addItemToBill() {
      const code = document.getElementById('manualBarcode').value.trim();
      if (!code) return;
      const item = inventory.find(i => i.id === code || i.name.toLowerCase() === code.toLowerCase());
      if (item) {
        cart.push(item);
        renderCart();
        document.getElementById('manualBarcode').value = '';
      } else {
        alert('Item not found in inventory!');
      }
    }

    function renderCart() {
      const list = document.getElementById('cartList');
      let total = 0;
      list.innerHTML = cart.map((item, idx) => {
        total += Number(item.price);
        return `<li class="flex justify-between py-1.5">
          <span>${item.name}</span>
          <span class="font-bold">₹${item.price}</span>
        </li>`;
      }).join('');
      document.getElementById('cartTotal').innerText = '₹' + total;
    }

    function completeSale(sendWhatsApp) {
      if (cart.length === 0) return alert('Cart is empty!');

      const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
      const mobile = document.getElementById('custMobile').value.trim();

      if (sendWhatsApp) {
        if (!mobile) return alert('Please enter customer mobile number for WhatsApp bill!');
        
        let msg = `🛍️ *Sri Sai Collection*\n`;
        msg += `-------------------------------\n`;
        cart.forEach(i => {
          msg += `• ${i.name} - ₹${i.price}\n`;
        });
        msg += `-------------------------------\n`;
        msg += `*Total Bill Amount: ₹${total}*\n\n`;
        msg += `Thank you for shopping with us! 🙏`;

        const waUrl = `https://wa.me/91${mobile}?text=${encodeURIComponent(msg)}`;
        window.open(waUrl, '_blank');
      } else {
        alert('Sale Completed! Total: ₹' + total);
      }

      cart = [];
      renderCart();
      document.getElementById('custMobile').value = '';
    }

    function saveStockItem() {
      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const barcode = document.getElementById('itemBarcode').value || Date.now().toString().slice(-6);
      const qty = document.getElementById('itemQty').value || 1;

      if (!name || !price) return alert("Item Name aur Price zaroori hain");

      const itemData = { id: barcode, name, price: Number(price), qty: Number(qty) };

      if (db) {
        db.ref('inventory/' + barcode).set(itemData);
      } else {
        inventory.push(itemData);
        renderInventory();
      }

      alert("Item Saved Successfully!");
      document.getElementById('itemName').value = '';
      document.getElementById('itemPrice').value = '';
      document.getElementById('itemBarcode').value = '';
      document.getElementById('itemQty').value = '';
    }

    function renderInventory() {
      const list = document.getElementById('stockList');
      if (!list) return;
      list.innerHTML = inventory.map(item => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded border text-xs">
          <div>
            <p class="font-bold text-gray-800">${item.name}</p>
            <p class="text-gray-400">ID: ${item.id} | Qty: ${item.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-indigo-600">₹${item.price}</span>
            <button onclick="openStickerModal('${item.id}', '${item.name}', ${item.price})" class="bg-gray-200 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-[10px] font-bold">
              🖨️ Sticker
            </button>
          </div>
        </div>
      `).join('');
    }

    function openStickerModal(id, name, price) {
      document.getElementById('stkName').innerText = name;
      document.getElementById('stkPrice').innerText = 'MRP: ₹' + price;
      
      JsBarcode("#stkBarcode", id, {
        format: "CODE128",
        width: 1.5,
        height: 40,
        displayValue: true,
        fontSize: 10
      });

      document.getElementById('stickerModal').classList.remove('hidden');
    }

    function closeStickerModal() {
      document.getElementById('stickerModal').classList.add('hidden');
    }

    function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
    function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
  </script>
</body>
</html>
